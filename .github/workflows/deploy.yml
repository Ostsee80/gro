name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Testumgebung: new.gro-erodiertechnik.com (für Google gesperrt).
  # Für den Livegang STAGING auf "0" und FTP_SERVER_DIR auf das Live-Verzeichnis setzen.
  STAGING: '1'
  FTP_SERVER: ae939.netcup.net   # Name aus dem TLS-Zertifikat des netcup-Servers
  FTP_USERNAME: claude
  FTP_SERVER_DIR: /httpdocs/   # relativ zum Startordner des FTP-Kontos

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_STAGING: ${{ env.STAGING }}

      - name: Entwurf „hell“ bauen (Unterordner /entwurf-hell/)
        if: env.STAGING == '1'
        run: |
          npx astro build --outDir dist/entwurf-hell
          rm -f dist/entwurf-hell/robots.txt dist/entwurf-hell/sitemap-*.xml dist/entwurf-hell/llms.txt
        env:
          PUBLIC_STAGING: '1'
          PUBLIC_THEME: light
          BASE_PATH: /entwurf-hell

      - name: Testumgebung für Suchmaschinen sperren
        if: env.STAGING == '1'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Zertifikat des FTP-Servers anzeigen
        continue-on-error: true
        run: |
          echo | timeout 20 openssl s_client -starttls ftp -connect "$FTP_SERVER:21" -servername "$FTP_SERVER" 2>/dev/null \
            | openssl x509 -noout -subject -ext subjectAltName || true

      - name: Upload per FTPS zu netcup
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 --exclude-glob .git* ./dist/ $FTP_SERVER_DIR
          bye
          EOF
