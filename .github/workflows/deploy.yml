name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # LIVE: gro-erodiertechnik.com (für Google freigegeben).
  # Design-Entwürfe liegen unter /1/ (hell) und /2/ (Barth) und bleiben für Google gesperrt.
  STAGING: '0'
  FTP_SERVER: ae939.netcup.net   # Name aus dem TLS-Zertifikat des netcup-Servers
  FTP_USERNAME: claude
  FTP_SERVER_DIR: /httpdocs/   # relativ zum Startordner des FTP-Kontos

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_STAGING: ${{ env.STAGING }}

      - name: Entwurf 1 „hell“ bauen (Unterordner /1/, noindex)
        run: |
          npx astro build --outDir dist/1
          rm -f dist/1/robots.txt dist/1/sitemap-*.xml dist/1/llms.txt
          # Eigene Rewrite-Regeln entfernen, damit die der Hauptseite greifen
          echo '# Entwurf: es gelten die Regeln der Hauptseite' > dist/1/.htaccess
        env:
          PUBLIC_STAGING: '1'
          PUBLIC_THEME: light
          BASE_PATH: /1

      - name: Entwurf 2 „Barth“ bauen (Unterordner /2/, noindex)
        run: |
          npx astro build --outDir dist/2
          rm -f dist/2/robots.txt dist/2/sitemap-*.xml dist/2/llms.txt
          echo '# Entwurf: es gelten die Regeln der Hauptseite' > dist/2/.htaccess
        env:
          PUBLIC_STAGING: '1'
          PUBLIC_THEME: barth
          BASE_PATH: /2

      - name: Komplette Seite für Suchmaschinen sperren (nur falls STAGING=1)
        if: env.STAGING == '1'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Zertifikat des FTP-Servers anzeigen
        continue-on-error: true
        run: |
          echo | timeout 20 openssl s_client -starttls ftp -connect "$FTP_SERVER:21" -servername "$FTP_SERVER" 2>/dev/null \
            | openssl x509 -noout -subject -ext subjectAltName || true

      - name: Upload per FTPS zu netcup
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 --exclude-glob .git* ./dist/ $FTP_SERVER_DIR
          bye
          EOF
